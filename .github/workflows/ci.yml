name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint + Type-check + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas y deps de test
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest \
            tiktoken pydantic pydantic-settings structlog langdetect

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check, gradual — informativo por ahora)
        continue-on-error: true
        run: mypy

      - name: Pytest (suite offline)
        run: pytest -q

  lock:
    name: Generar lock pinneado (reproducibilidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar locks desde requirements*.txt
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile requirements.txt --output-file requirements.lock --quiet
          pip-compile requirements-eval.txt --output-file requirements-eval.lock --quiet

      - name: Publicar los locks como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: requirements-locks
          path: |
            requirements.lock
            requirements-eval.lock

  security:
    name: Escaneo de seguridad (deps + secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (vulnerabilidades conocidas en requirements.lock)
        run: |
          python -m pip install --upgrade pip pip-audit
          # requirements.lock es exactamente lo que corre en producción
          # (webhook, job de ingesta, Admin UI). ragas/deepeval (con CVEs
          # conocidas sin fix aún) viven aparte en requirements-eval.txt y
          # NUNCA se instalan en las imágenes Docker, así que no aplica
          # ningún --ignore-vuln aquí.
          pip-audit -r requirements.lock --no-deps

      - name: pip-audit del stack de observabilidad (Confident AI / DeepEval)
        run: |
          # requirements-observability.txt SÍ entra en la imagen de producción
          # del agente (Dockerfile), a diferencia de requirements-eval.txt. Se
          # replica exactamente el mecanismo de instalación del Dockerfile (venv
          # limpio + mismo constraint derivado de requirements.lock) y se audita
          # el entorno resultante completo (con transitivas: openai, posthog,
          # sentry-sdk, opentelemetry...), no solo el paquete deepeval en sí.
          # OJO: si el sed del Dockerfile cambia, actualízalo también aquí.
          python -m venv /tmp/obs-venv
          /tmp/obs-venv/bin/pip install --upgrade pip
          /tmp/obs-venv/bin/pip install -r requirements.lock
          sed -E -e 's/\[[^][]*\]//g' -e '/^click==/d' requirements.lock > /tmp/core-constraints.txt
          /tmp/obs-venv/bin/pip install -r requirements-observability.txt -c /tmp/core-constraints.txt
          /tmp/obs-venv/bin/pip install pip-audit
          /tmp/obs-venv/bin/pip-audit

      - name: gitleaks (secret-scanning del working tree)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git -v --exit-code 1
