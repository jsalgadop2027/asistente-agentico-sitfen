<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente conversacional de Información Temprana</title>
<style>
  :root { --azul:#1f4e79; --azul2:#2e74b5; --bg:#0e1726; --card:#16223a; --txt:#e8eef7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; color:var(--txt);
         background:linear-gradient(135deg,#0e1726,#13233f 60%,#1b3358); min-height:100vh; }
  header { text-align:center; padding:14px; }
  header h1 { margin:0; font-size:1.25rem; color:#cfe3ff; }
  header small { color:#8fa9cf; }
  .wrap { max-width:980px; margin:0 auto; padding:8px 14px 24px;
          display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid #25406b; border-radius:16px;
           overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  #avatar { width:100%; height:440px; position:relative;
            background:radial-gradient(circle at 50% 30%,#27406b,#0f1a2e); }
  #avatar.failed::before{ content:"🍇 SITFEN"; position:absolute; top:0; left:0; right:0;
           height:60%; display:flex; align-items:center; justify-content:center;
           font-size:2rem; color:#6f8bb8; }
  /* Muestra el motivo real del fallo (antes quedaba oculto). */
  #avatarErr { position:absolute; bottom:0; left:0; right:0; padding:8px 12px;
           font-size:.72rem; color:#ffb4b4; background:rgba(0,0,0,.4);
           white-space:pre-wrap; display:none; }
  #avatar.failed #avatarErr{ display:block; }
  .chat { display:flex; flex-direction:column; height:440px; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .m { display:flex; }
  .m.user { justify-content:flex-end; }
  .bubble { max-width:85%; padding:9px 13px; border-radius:14px; line-height:1.35;
            white-space:pre-wrap; font-size:.93rem; }
  .m.bot .bubble { background:#1d2f4f; border:1px solid #2c4a78;
            border-top-left-radius:4px; }
  .m.user .bubble { background:var(--azul2); color:#fff; border-top-right-radius:4px; }
  /* Barra de envío con look estilo WhatsApp: cuadro de texto en píldora +
     micrófono circular verde (color de marca de WhatsApp). */
  .row { display:flex; gap:8px; padding:10px; border-top:1px solid #25406b; background:#13223c;
         align-items:flex-end; }
  #msg { flex:1; padding:11px 16px; border-radius:22px; border:1px solid #2c4a78;
         background:#0e1a2f; color:var(--txt); font-size:.95rem; outline:none;
         font-family:inherit; resize:none; }
  button { border:none; border-radius:12px; padding:0 15px; font-weight:600; cursor:pointer; color:#fff; }
  .row button { padding:11px 15px; }
  #send { background:var(--azul2); border-radius:22px; }
  #send:disabled { opacity:.5; cursor:default; }
  #mic { background:#25d366; color:#fff; font-size:1.15rem; transition:background .15s;
         width:44px; height:44px; padding:0; border-radius:50%;
         display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  #mic.rec { background:#c0392b; animation:micpulse 1.1s ease-in-out infinite; }
  @keyframes micpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(192,57,43,.6); } 50%{ box-shadow:0 0 0 7px rgba(192,57,43,0); } }
  #status { text-align:center; font-size:.8rem; color:#8fa9cf; padding:4px; min-height:20px; }
  a { color:#7fb3ff; }
  /* Indicador "escribiendo": tres puntos que rebotan en una burbuja de bot. */
  .m.typing .bubble { display:inline-flex; gap:5px; align-items:center; padding:12px 14px; }
  .m.typing .dot { width:7px; height:7px; border-radius:50%; background:#7fa6d8;
           animation:tdot 1.2s infinite ease-in-out both; }
  .m.typing .dot:nth-child(2){ animation-delay:.2s; }
  .m.typing .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes tdot { 0%,80%,100%{ transform:scale(.6); opacity:.4; }
           40%{ transform:scale(1); opacity:1; } }
  /* Chip "pensando" sobre el panel del avatar (también visible en modo texto). */
  #thinking { position:absolute; top:10px; left:50%; transform:translateX(-50%);
           display:none; align-items:center; gap:8px; padding:6px 13px; border-radius:999px;
           background:rgba(20,34,60,.85); border:1px solid #2c4a78; color:#cfe3ff;
           font-size:.8rem; z-index:3; }
  #avatar.thinking #thinking{ display:inline-flex; }
  #thinking .spin { width:13px; height:13px; border:2px solid #44699e;
           border-top-color:#cfe3ff; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Panel del avatar con columna de controles a la izquierda de la animación. */
  .avatarpanel { display:flex; align-items:stretch; }
  #avatarControls { display:flex; flex-direction:column; gap:8px; justify-content:center;
           padding:12px 10px; background:#13223c; border-right:1px solid #25406b; width:132px; }
  #avatarControls button { background:#2a3f63; font-size:.8rem; padding:9px 6px;
           border-radius:10px; white-space:normal; line-height:1.2; text-align:center; }
  #avatarControls button:disabled { opacity:.4; cursor:default; }
  #btnStop { background:#7a2f3e; }
  #btnProactive { background:#1f6e4f; }
  #btnHelp { background:#3a5a8c; }
  .ctrlLabel { font-size:.72rem; color:#8fa9cf; text-transform:uppercase;
           letter-spacing:.03em; margin-bottom:-4px; }
  /* Lista de animadores disponibles (mujer/hombre), al costado de la imagen. */
  #avatarSelect { background:#0e1a2f; color:var(--txt); border:1px solid #2c4a78;
           border-radius:10px; padding:8px; font-size:.85rem; }
  #avatarSelect:disabled { opacity:.4; cursor:default; }
  /* Fuentes citadas del boletín del FEN (Grounding con Google Search). */
  .fenSources { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.15);
           display:flex; flex-direction:column; gap:4px; font-size:.78rem; }
  .fenSourcesLabel { opacity:.75; font-weight:600; }
  .fenSources a { color:#7fb3ff; word-break:break-word; }
  .avatarpanel #avatar { flex:1; min-width:0; }
  /* Visor del animador "Robot": canvas propio (Three.js directo, sin
     TalkingHead), oculto por defecto y mostrado sobre el mismo panel. */
  #robotCanvas { position:absolute; inset:0; width:100%; height:100%; display:none; }
</style>
</head>
<body>
  <header>
    <h1>🍇 Asistente conversacional de Información Temprana</h1>
    <small>Inteligencia comercial y estratégica para Mypes · RAG agéntico en Google Cloud</small>
  </header>
  <div class="wrap">
    <div class="panel avatarpanel">
      <div id="avatarControls">
        <button id="btnHelp" title="Cómo usar SITFEN">📋 Instrucciones</button>
        <label class="ctrlLabel" for="avatarSelect">Animador</label>
        <select id="avatarSelect" disabled title="Elegir el animador del avatar">
          <option value="F">Mujer</option>
          <option value="M">Hombre</option>
          <option value="R">Robot</option>
        </select>
        <button id="btnPause" disabled title="Pausar o reanudar la lectura">⏸ Pausar</button>
        <button id="btnStop" disabled title="Terminar la lectura de la respuesta">⏹ Terminar</button>
        <button id="btnProactive" title="Boletín del FEN con fuentes de internet">🌐 Proactivo</button>
      </div>
      <div id="avatar"><div id="thinking"><span class="spin"></span>SITFEN está pensando…</div><div id="avatarErr"></div><canvas id="robotCanvas"></canvas></div>
    </div>
    <div class="panel chat">
      <div id="log"></div>
      <div class="row">
        <textarea id="msg" placeholder="Escribe tu consulta sobre exportación, sanidad, costos…" rows="3"></textarea>
        <button id="mic" title="Hablar">🎤</button>
        <button id="send">Enviar</button>
      </div>
    </div>
  </div>
  <div id="status"></div>

<!--
  Assets AUTO-HOSPEDADOS desde el mismo origen de Cloud Run (sin dependencias
  externas: ni jsdelivr ni readyplayer.me). Se hornean en la imagen Docker
  durante el build (ver Dockerfile). Servidos bajo /vendor/ y /avatar*.glb.
-->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "talkinghead": "/vendor/talkinghead/talkinghead.mjs"
}}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const API_BASE = "https://arandano-agent-291385120876.us-central1.run.app";  // backend Cloud Run
// Modelos 3D auto-hospedados en la imagen, uno por animador seleccionable.
const MODEL_URLS = { F: "/avatar.glb", M: "/avatar_male.glb" };
const ROBOT_MODEL_URL = "/avatar_robot.glb";

let TalkingHead = null, importError = null;
try { ({ TalkingHead } = await import("talkinghead")); }
catch (e) { importError = e; console.error("No se pudo cargar TalkingHead:", e); }

const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
let head = null, avatarReady = false, currentGender = "F";

const $ = id => document.getElementById(id);
const elAvatar=$("avatar"), elAvatarErr=$("avatarErr"), elThinking=$("thinking"),
      elLog=$("log"), elInput=$("msg"),
      elSend=$("send"), elMic=$("mic"), elStatus=$("status"),
      btnPause=$("btnPause"), btnStop=$("btnStop"),
      elAvatarSelect=$("avatarSelect"), btnProactive=$("btnProactive"),
      btnHelp=$("btnHelp"), elRobotCanvas=$("robotCanvas");

// --- Animador "Robot": visor Three.js propio, FUERA del pipeline de
// TalkingHead -- el modelo del robot no tiene el rig/blend shapes de Ready
// Player Me que TalkingHead exige (showAvatar() lanzaría "Blend shapes not
// found"), así que se carga y anima aparte, mostrando su animación "Idle" en
// loop. Sin lipsync ni mirada (no hay integración con el habla). La voz sigue
// sonando normal: no se toca head/audioCtx, solo se oculta su canvas.
let robotState = null;
const robotResizeObserver = new ResizeObserver(() => {
  if(!robotState) return;
  robotState.camera.aspect = elAvatar.clientWidth / elAvatar.clientHeight;
  robotState.camera.updateProjectionMatrix();
  robotState.renderer.setSize(elAvatar.clientWidth, elAvatar.clientHeight);
});
robotResizeObserver.observe(elAvatar);

async function initRobotViewer(){
  if(robotState) return robotState;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, elAvatar.clientWidth / elAvatar.clientHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ canvas: elRobotCanvas, antialias: true, alpha: true });
  renderer.setSize(elAvatar.clientWidth, elAvatar.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  scene.add(new THREE.AmbientLight(0xffffff, 1.1));
  const dir = new THREE.DirectionalLight(0xffffff, 1.3);
  dir.position.set(2, 4, 3);
  scene.add(dir);

  const gltf = await new GLTFLoader().loadAsync(ROBOT_MODEL_URL);
  scene.add(gltf.scene);

  // Encuadre automático por bounding box (no coordenadas fijas a ojo): centra
  // la cámara en el modelo y la aleja lo justo según su tamaño real, mirando
  // un poco por encima del centro (torso/cabeza, como los otros animadores).
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = (maxDim / (2 * Math.tan((camera.fov * Math.PI / 180) / 2))) * 1.15;
  const focusY = center.y + size.y * 0.18;
  camera.position.set(center.x, focusY, center.z + dist);
  camera.lookAt(center.x, focusY, center.z);
  camera.near = Math.max(0.01, dist / 100);
  camera.far = dist * 10;
  camera.updateProjectionMatrix();

  const mixer = new THREE.AnimationMixer(gltf.scene);
  const clip = gltf.animations.find(c => /idle/i.test(c.name)) || gltf.animations[0];
  if(clip) mixer.clipAction(clip).play();

  robotState = { scene, camera, renderer, mixer, clock: new THREE.Clock(), running: false, rafId: null };
  return robotState;
}

function robotLoop(){
  if(!robotState || !robotState.running) return;
  robotState.mixer.update(robotState.clock.getDelta());
  robotState.renderer.render(robotState.scene, robotState.camera);
  robotState.rafId = requestAnimationFrame(robotLoop);
}

async function showRobot(){
  await initRobotViewer();
  if(head && head.renderer) head.renderer.domElement.style.display = "none";
  elRobotCanvas.style.display = "block";
  robotState.clock.getDelta(); // descarta el tiempo transcurrido mientras estuvo oculto
  robotState.running = true;
  robotLoop();
}

function hideRobot(){
  if(!robotState) return;
  robotState.running = false;
  if(robotState.rafId) cancelAnimationFrame(robotState.rafId);
  elRobotCanvas.style.display = "none";
  if(head && head.renderer) head.renderer.domElement.style.display = "";
}

const setStatus = t => elStatus.textContent = t;
// Marca el avatar como fallido y MUESTRA el motivo real en pantalla.
function failAvatar(statusMsg, err){
  elAvatar.classList.add("failed");
  setStatus(statusMsg);
  if(err){ elAvatarErr.textContent = "Detalle: " + (err.message || err); console.error(statusMsg, err); }
}
const escapeHtml = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function addMsg(who, text){
  const d=document.createElement("div"); d.className="m "+who;
  d.innerHTML=`<div class="bubble">${escapeHtml(text)}</div>`;
  elLog.appendChild(d); elLog.scrollTop=elLog.scrollHeight;
}

// Boletín del FEN (botón de proactividad): igual que addMsg pero con la lista
// de fuentes citadas debajo, como enlaces. Se arma con el DOM API (no innerHTML
// con texto ajeno) porque título/dominio vienen de la web abierta.
function addFenBriefing(text, sources){
  const d=document.createElement("div"); d.className="m bot";
  const bubble=document.createElement("div"); bubble.className="bubble";
  const p=document.createElement("div"); p.textContent=text;
  bubble.appendChild(p);
  const links=(sources||[]).filter(s=>s && /^https?:\/\//i.test(s.uri||""));
  if(links.length){
    const box=document.createElement("div"); box.className="fenSources";
    const label=document.createElement("div"); label.className="fenSourcesLabel";
    label.textContent="Fuentes:";
    box.appendChild(label);
    links.forEach(s=>{
      const a=document.createElement("a");
      a.href=s.uri; a.target="_blank"; a.rel="noopener noreferrer";
      a.textContent = s.title || s.domain || s.uri;
      box.appendChild(a);
    });
    bubble.appendChild(box);
  }
  d.appendChild(bubble);
  elLog.appendChild(d); elLog.scrollTop=elLog.scrollHeight;
}

// Indicador de espera: burbuja con puntos animados + chip y mirada pensativa
// del avatar mientras el sistema atiende la solicitud.
let typingEl = null;
function avatarThink(on){
  if(!avatarReady || !head) return;
  try{
    if(on){
      const r = elAvatar.getBoundingClientRect();
      head.lookAt(r.left + r.width*0.78, r.top + r.height*0.20, 1200); // mirada arriba-derecha
    }else{
      head.lookAhead(800);
    }
  }catch(_){}
}
function showThinking(on){
  elAvatar.classList.toggle("thinking", on);
  avatarThink(on);
  if(on){
    if(typingEl) return;
    typingEl=document.createElement("div"); typingEl.className="m bot typing";
    typingEl.innerHTML=`<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    elLog.appendChild(typingEl); elLog.scrollTop=elLog.scrollHeight;
  }else if(typingEl){
    typingEl.remove(); typingEl=null;
  }
}

async function initAvatar(){
  if(!TalkingHead){
    failAvatar("Modo texto (no se cargó la librería del avatar)", importError);
    return;
  }
  try{
    setStatus("Cargando avatar 3D…");
    head = new TalkingHead(elAvatar, {
      ttsEndpoint: API_BASE + "/api/tts", ttsApikey: null,
      ttsLang: "es-US", ttsVoice: "es-US-Neural2-A",
      lipsyncLang: "en", cameraView: "upper"
    });
    await head.showAvatar({
      url: MODEL_URLS[currentGender],
      body: currentGender, avatarMood: "neutral", lipsyncLang: "en"
    });
    avatarReady = true; setStatus("Listo"); elAvatarSelect.disabled = false;
  }catch(e){
    failAvatar("Modo texto (no se cargó el modelo 3D)", e);
  }
}

// --- Selector de animador (mujer/hombre), lista al costado de la imagen -------
async function switchAvatar(gender){
  if(!avatarReady || !head || gender === currentGender) return;
  if(gender === "R"){
    elAvatarSelect.disabled = true; setStatus("Cargando robot…");
    try{
      await showRobot();
      currentGender = "R"; setStatus("Listo");
    }catch(e){
      console.error("showRobot:", e);
      setStatus("No se pudo cargar el robot.");
      elAvatarSelect.value = currentGender; // revertir la selección visual
    }finally{
      elAvatarSelect.disabled = false;
    }
    return;
  }
  const wasRobot = currentGender === "R";
  if(wasRobot) hideRobot();
  const url = MODEL_URLS[gender];
  if(!url){ if(wasRobot) showRobot(); return; }
  elAvatarSelect.disabled = true; setStatus("Cargando animador…");
  try{
    await head.showAvatar({ url, body: gender, avatarMood: "neutral", lipsyncLang: "en" });
    currentGender = gender; setStatus("Listo");
  }catch(e){
    console.error("switchAvatar:", e);
    setStatus("No se pudo cargar ese animador.");
    elAvatarSelect.value = currentGender; // revertir la selección visual
    if(wasRobot) await showRobot(); // currentGender sigue siendo "R": restaurar la vista
  }finally{
    elAvatarSelect.disabled = false;
  }
}
elAvatarSelect.addEventListener("change", e => switchAvatar(e.target.value));

// --- Pronunciación en español -------------------------------------------------
// TalkingHead preprocesa el texto a TTS en el idioma de lip-sync (en), lo que
// convierte números y símbolos a palabras inglesas. Como no existe lip-sync en
// español, los expandimos a español ANTES de hablar para que no quede inglés.
const UNID=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve',
  'diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho',
  'diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco',
  'veintiséis','veintisiete','veintiocho','veintinueve'];
const DECENAS=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const CENTENAS=['','ciento','doscientos','trescientos','cuatrocientos','quinientos',
  'seiscientos','setecientos','ochocientos','novecientos'];
function seccion(n){ // 0..999
  if(n===0) return '';
  if(n===100) return 'cien';
  let out=''; const c=Math.floor(n/100), r=n%100;
  if(c) out+=CENTENAS[c]+' ';
  if(r<30){ if(r) out+=UNID[r]; }
  else { const d=Math.floor(r/10), u=r%10; out+=DECENAS[d]; if(u) out+=' y '+UNID[u]; }
  return out.trim();
}
function secMiles(n){ return seccion(n).replace('veintiuno','veintiún').replace(/\buno\b/,'un'); }
function enteroATexto(n){
  if(n===0) return 'cero';
  let out=''; const mill=Math.floor(n/1000000), resto=n%1000000;
  const miles=Math.floor(resto/1000), u=resto%1000;
  if(mill) out+=(mill===1?'un millón':secMiles(mill)+' millones')+' ';
  if(miles) out+=(miles===1?'mil':secMiles(miles)+' mil')+' ';
  if(u) out+=seccion(u);
  return out.trim();
}
function numeroATexto(str){
  let s=String(str).trim();
  if(s.includes(',')){ s=s.replace(/\./g,'').replace(',','.'); }
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,''); }
  let [ent,dec]=s.split('.');
  ent=(ent||'').replace(/\D/g,'')||'0';
  let n=parseInt(ent,10);
  if(n>999999999) return str; // demasiado grande: déjalo
  let out=enteroATexto(n);
  if(dec){ out+=' coma '+[...dec.replace(/\D/g,'')].map(d=>UNID[+d]).join(' '); }
  return out;
}
function prepareSpeech(text){
  let t=text.replace(/[*_`#>|]/g,' ');                 // quita markdown
  t=t.replace(/\$\s?(\d[\d.,]*)/g,(m,n)=>numeroATexto(n)+' dólares ');
  t=t.replace(/(\d[\d.,]*)\s?%/g,(m,n)=>numeroATexto(n)+' por ciento ');
  t=t.replace(/%/g,' por ciento ').replace(/\$/g,' dólares ').replace(/€/g,' euros ')
     .replace(/\+/g,' más ').replace(/&/g,' y ').replace(/=/g,' igual ')
     .replace(/[°º]/g,' grados ');
  t=t.replace(/\d[\d.,]*/g,m=>numeroATexto(m));         // números restantes
  return t.replace(/\s+/g,' ').trim();
}

// Divide el texto en oraciones para hablarlas por partes: TalkingHead sintetiza
// el audio completo de cada llamada a speakText ANTES de reproducir nada, así
// que una respuesta larga como una sola llamada deja al avatar mudo varios
// segundos. Encolando oración por oración (su propia cola interna las reproduce
// en orden) la primera empieza a sonar apenas se sintetiza, sin esperar al resto.
function splitSpeechChunks(text){
  const partes = text.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  for(const p of partes){
    const t = p.trim();
    if(!t) continue;
    // fusiona fragmentos muy cortos (p. ej. una inicial suelta) para no pedirle
    // a la TTS frases de una sola palabra
    if(chunks.length && t.length < 12) chunks[chunks.length-1] += ' ' + t;
    else chunks.push(t);
  }
  return chunks.length ? chunks : [text];
}

// --- Control de la lectura (Pausar/Reanudar/Terminar) -------------------------
let speaking=false, paused=false;
function setControls(on){
  speaking=on;
  btnPause.disabled=!on; btnStop.disabled=!on;
  if(!on){ paused=false; btnPause.textContent='⏸ Pausar'; }
}
function waitSpeechEnd(){
  return new Promise(res=>{
    let started=false, ticks=0;
    const iv=setInterval(()=>{
      ticks++;
      if(!head){ clearInterval(iv); return res(); }
      if(head.isSpeaking) started=true;
      if((started && !head.isSpeaking && !paused) || (!started && ticks>12)){
        clearInterval(iv); res();
      }
    },300);
  });
}
async function speak(text){
  if(!avatarReady || !head) return;
  setControls(true); setStatus('Reproduciendo…');
  try{
    const chunks = splitSpeechChunks(prepareSpeech(text));
    // Se encolan todas de una vez: la cola interna de TalkingHead las reproduce
    // en orden, así que la primera frase suena mientras las siguientes todavía
    // se están sintetizando en segundo plano.
    for(const chunk of chunks){
      const p = head.speakText(chunk);
      if(p && typeof p.catch === 'function') p.catch(e=>console.error('speak chunk:', e));
    }
  }
  catch(e){ console.error('speak:', e); setStatus('Voz no disponible (revisa /api/tts)'); setControls(false); return; }
  await waitSpeechEnd();
  setControls(false);
  if(elStatus.textContent==='Reproduciendo…') setStatus('Listo');
}
btnPause.addEventListener('click',()=>{
  if(!avatarReady || !head || !speaking) return;
  if(paused){ try{ head.start(); }catch(_){ } paused=false; btnPause.textContent='⏸ Pausar'; setStatus('Reproduciendo…'); }
  else { try{ head.stop(); }catch(_){ } paused=true; btnPause.textContent='▶ Reanudar'; setStatus('Pausado'); }
});
btnStop.addEventListener('click',()=>{
  if(!avatarReady || !head) return;
  try{ head.stopSpeaking(); }catch(_){ }
  if(paused){ try{ head.start(); }catch(_){ } }   // reanuda la animación de reposo
  setControls(false); setStatus('Listo');
});

// --- Botón de proactividad: boletín del FEN con fuentes de internet -----------
// Consulta la web abierta (Grounding con Google Search) a demanda del usuario;
// no depende de identificación de usuario ni de sesión, igual que el resto del
// cliente de escritorio. Muestra SIEMPRE la fuente citada.
btnProactive.addEventListener("click", async () => {
  btnProactive.disabled = true; setStatus("Buscando información del FEN…"); showThinking(true);
  try{
    const r = await fetch(API_BASE + "/api/fen-briefing", {method:"POST"});
    const data = await r.json();
    showThinking(false);
    addFenBriefing(data.text || "No obtuve el boletín.", data.sources || []);
    setStatus("Listo");
    speak(data.text || "");
  }catch(e){
    console.error("fen-briefing:", e);
    showThinking(false);
    addMsg("bot", "No pude generar el boletín del FEN ahora mismo. Intenta de nuevo en unos minutos.");
    setStatus("Error");
  }finally{
    btnProactive.disabled = false;
  }
});

// --- Botón de instrucciones: cómo usar la solución, en globos de texto --------
const INSTRUCTIONS = [
  "📋 Así puedes usar SITFEN:",
  "1️⃣ Escribe tu consulta en el cuadro de texto y presiona «Enviar» (o Enter). Usa Shift+Enter para un salto de línea.",
  "2️⃣ Toca el micrófono 🎤 para hablar tu consulta por voz; tócalo de nuevo para terminar de grabar.",
  "3️⃣ Te respondo por texto y voz. Usa «⏸ Pausar» o «⏹ Terminar» para controlar la lectura en voz alta.",
  "4️⃣ Elige el animador (Mujer, Hombre o Robot) desde la lista al costado del avatar.",
  "5️⃣ Presiona «🌐 FEN» cuando quieras un boletín con advertencias, consejos y recomendaciones sobre el Fenómeno de El Niño, siempre con la fuente citada.",
];
btnHelp.addEventListener("click", () => {
  btnHelp.disabled = true;
  INSTRUCTIONS.forEach((msg, i) => {
    setTimeout(() => {
      addMsg("bot", msg);
      if(i === INSTRUCTIONS.length - 1) btnHelp.disabled = false;
    }, i * 450);
  });
});

let busy=false;
async function send(text){
  text=(text!==undefined?text:elInput.value).trim();
  if(!text || busy) return;
  busy=true; elInput.value=""; addMsg("user", text);
  setStatus("SITFEN está pensando…"); elSend.disabled=true; showThinking(true);
  try{
    const r=await fetch(API_BASE + "/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
                         body:JSON.stringify({message:text, session_id:sessionId})});
    const data=await r.json();
    const reply=data.reply || "Lo siento, no obtuve respuesta.";
    showThinking(false);
    addMsg("bot", reply); setStatus("Listo"); speak(reply);
  }catch(e){ console.error(e); showThinking(false); addMsg("bot","Hubo un problema de conexión. Intenta de nuevo."); setStatus("Error"); }
  finally{ busy=false; elSend.disabled=false; showThinking(false); }
}

elSend.addEventListener("click",()=>send());
// Enter envía; Shift+Enter inserta salto de línea (el cuadro ahora es multilínea).
elInput.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });

// Micrófono: graba audio con MediaRecorder y lo transcribe en el servidor
// (/api/stt). NO usa la Web Speech API (es Chrome-only y no funciona en Electron).
// Toggle: pulsar para iniciar; pulsar de nuevo para terminar, transcribir y enviar.
let mediaRec=null, chunks=[], recording=false;
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    mediaRec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      recording=false; elMic.classList.remove("rec");
      const blob=new Blob(chunks,{type:(mediaRec&&mediaRec.mimeType)||"audio/webm"});
      if(!blob.size){ setStatus("Listo"); return; }
      setStatus("Transcribiendo…");
      try{
        const r=await fetch(API_BASE+"/api/stt",{method:"POST",headers:{"Content-Type":blob.type},body:blob});
        const j=await r.json(); const t=(j.text||"").trim();
        if(t){ setStatus("Listo"); send(t); }
        else { setStatus("No se entendió el audio. Intenta de nuevo."); }
      }catch(_){ setStatus("Error al transcribir"); }
    };
    mediaRec.start(); recording=true; elMic.classList.add("rec");
    setStatus("Grabando… (pulsa de nuevo para terminar)");
  }catch(_){ setStatus("Sin acceso al micrófono"); }
}
function stopRec(){ try{ if(mediaRec && mediaRec.state!=="inactive") mediaRec.stop(); }catch(_){} }
if(navigator.mediaDevices && window.MediaRecorder){
  elMic.addEventListener("click",()=>{ recording ? stopRec() : startRec(); });
} else { elMic.style.display="none"; }

addMsg("bot","¡Hola! Soy SITFEN, tu asistente virtual de orientación empresarial 🍇. Pregúntame sobre exportación, requisitos sanitarios, costos o mercados.");
initAvatar();
