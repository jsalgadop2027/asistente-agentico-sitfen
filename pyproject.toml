[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# App de escritorio y proyectos ajenos al chatbot (scripts EETT aislados).
extend-exclude = [
    "desktop",
    "otros-proyectos",
]

[tool.mypy]
python_version = "3.12"
# Tipado gradual: empezamos laxos y se endurece con el tiempo.
ignore_missing_imports = true       # libs externas sin stubs (langchain, vertexai…)
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["app", "ingestion"]
exclude = "(desktop|otros-proyectos)"
